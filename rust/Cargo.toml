[package]
name = "bifrost-resolver"
version = "0.2.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
hickory-proto = "0.26"
rand = "0.10"
ipnet = "2"
