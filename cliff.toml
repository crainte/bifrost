# git-cliff configuration: https://git-cliff.org/docs/configuration
# Versions are derived from conventional commits: feat -> minor, fix -> patch,
# `!` or BREAKING CHANGE -> major (minor while < 1.0.0).

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. Generated by
[git-cliff](https://git-cliff.org) from conventional commits.

"""
# RELEASE_NOTES=1 renders the GitHub release body: the release title already
# carries the version, so the heading is dropped and a compare link is added.
body = """
{% set notes = get_env(name="RELEASE_NOTES", default="") %}\
{% if not notes %}\
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/crainte/bifrost/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/crainte/bifrost/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
{% if notes and previous and previous.version %}
**Full Changelog**: https://github.com/crainte/bifrost/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"
# Merge commits are already dropped as unconventional; the explicit skips keep
# that true even if filter_unconventional is ever relaxed.
commit_parsers = [
  { message = "^Merge (pull request|branch|remote-tracking branch)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^style", group = "<!-- 5 -->Style" },
  { message = "^(ci|build)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
