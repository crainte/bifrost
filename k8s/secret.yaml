# TEMPLATE ONLY — NOT applied by kustomization.yaml, on purpose. Do not commit
# real secrets. Provide via sealed-secrets, SOPS, external-secrets, or e.g.:
#   kubectl -n bifrost create secret generic bifrost-secrets \
#     --from-literal=BIFROST_COOKIE="$(openssl rand -hex 32)" \
#     --from-literal=BIFROST_SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=BIFROST_DB_PASSWORD=... \
#     --from-literal=BIFROST_ADMIN_USER=admin \
#     --from-literal=BIFROST_ADMIN_PASSWORD_HASH=...
# Bifrost refuses to start clustered with a placeholder or <32-byte cookie, and
# disables the UI (fails closed) with a placeholder or <32-byte session secret.
#
# Generate values:
#   BIFROST_COOKIE          openssl rand -hex 32   (MUST match on every pod;
#                                                   authenticates cluster membership)
#   BIFROST_DB_PASSWORD     your Postgres password
#   BIFROST_SESSION_SECRET  openssl rand -hex 32   (signs UI session cookies;
#                                                   rotating it invalidates sessions)
#   BIFROST_ADMIN_USER      the admin login name
#   BIFROST_ADMIN_PASSWORD_HASH
#       PBKDF2-SHA256 hash produced by the app's own hasher, so format matches
#       exactly. Generate with:
#         docker exec <pod> /opt/bifrost/bin/bifrost eval \
#           'io:format("~s~n",[bifrost_auth:hash_password(<<"your-password">>)]).'
#       (or run the same eval in any release console). Never store the plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: bifrost-secrets
  namespace: bifrost
type: Opaque
stringData:
  BIFROST_COOKIE: "CHANGE_ME_openssl_rand_hex_32"
  BIFROST_DB_PASSWORD: "CHANGE_ME"
  BIFROST_SESSION_SECRET: "CHANGE_ME_openssl_rand_hex_32"
  BIFROST_ADMIN_USER: "admin"
  BIFROST_ADMIN_PASSWORD_HASH: "CHANGE_ME_pbkdf2_hash_from_bifrost_auth"
